# Paramètres du cluster (Hadoop 3 / HDP 3.1, sécurisé par Kerberos)
nameNode=hdfs://au
jobTracker=<resource_manager_yarn>:8050
jdbcUrl=jdbc:hive2://hive-s2-1.au.adaltas.cloud:10000/
hivePrincipal=hive/_HOST@AU.ADALTAS.CLOUD
oozie.use.system.libpath=true

# Paramètres utilisateur, à adapter
clusterUsername=<utilisateur_hdfs>
hiveUsername=<prefixe_des_tables>
hiveDatabase=<base_hive_du_groupe>
group=<groupe_hdfs>

# Emplacement du workflow sur HDFS
wfDir=${nameNode}/education/${group}/${clusterUsername}/oozie_wf
oozie.wf.application.path=${wfDir}
